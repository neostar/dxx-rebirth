# gitleaks configuration for the fork: the pre-commit tier scans the staged
# changes, the pre-push hook the commits being pushed, and tools/dev/check.sh
# the whole history of HEAD (ADR 4; no GitHub workflow).
#
#   tools/dev/check.sh --pre-commit    gitleaks git --staged
#   tools/dev/check.sh --pre-push      gitleaks git --log-opts=<pushed range>
#   tools/dev/check.sh                 gitleaks git --log-opts=HEAD
#
# gitleaks' default rules, unchanged.  The fake token the tests plant is
# assembled at run time in a throwaway repository, so no file here holds
# one and nothing is allowlisted.  An allowlist entry ([[allowlists]]) is
# for a proven test fixture only; upstream's history (upstream/master)
# had no findings at 8.30.1 (2026-10-21), so it needs none either.
#
# A .gitleaksignore file or an inline gitleaks:allow comment in the fork is
# refused (check.sh's gitleaks_allow step) unless its file is listed here
# with a reason, one line each:
#   "# allowed: <path> -- <reason>"
# allowed: docs/adr/0005-cpp-safety-rules-for-new-code.md -- names the marker, allows nothing

[extend]
useDefault = true
