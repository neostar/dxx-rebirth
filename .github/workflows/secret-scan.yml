name: secret-scan

# The fork's one GitHub workflow (ADR 4): gitleaks on every commit that can
# reach sdl-gpu-port, as a backstop to the pre-commit tier, which a commit
# made with --no-verify or without tools/dev/setup.sh skips.  Everything
# else stays in tools/dev/ci.sh; tools/dev/check.sh's workflows step allows
# this file only while it runs gitleaks alone.

on:
  # push is narrowed to the integration branch: a pull request branch is
  # scanned by pull_request, so a bare push would scan each commit twice.
  push:
    branches: [sdl-gpu-port]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly full-history scan (Mon 04:00 UTC)
  workflow_dispatch:

# A superseded run is cancelled, never skipped: the newest commit is always
# scanned.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists a pull request's commits

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the scheduled scan
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The local pin (tools/dev/toolchain.pins); the action's default,
          # 8.24.3, predates the [[allowlists]] config format.
          GITLEAKS_VERSION: "8.30.1"
